# Development compose for NPMplus on Docker Desktop (Windows/Mac).
#
# Differences from the production compose.yaml:
#   - Uses bridge networking + published ports instead of `network_mode: host`
#     (host mode is unreliable on Docker Desktop).
#   - Runs the released image but bind-mounts your local ./backend over /app, so
#     you can edit backend JS on the host and just restart the container.
#   - node_modules and the prebuilt frontend are kept as named volumes so they
#     come from the image (correct musl-built native modules) and are NOT shadowed
#     by the bind mount.
#   - Seeds an initial admin user and a fixed cookie secret for convenience.
#
# Usage:
#   docker compose -f compose.dev.yaml up -d
#   docker compose -f compose.dev.yaml restart   # apply backend code changes
#   docker compose -f compose.dev.yaml logs -f
#   docker compose -f compose.dev.yaml down
#
# The admin UI + API is then at https://localhost:8181 (self-signed cert).
name: npmplus-dev
services:
  npmplus:
    container_name: npmplus-dev
    # Built from Dockerfile.dev = released image + reinstalled develop backend deps.
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: npmplus-dev:latest
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - SETGID
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:8181:81"     # admin UI + API (https)
#      - "127.0.0.1:8080:80"    # uncomment if you want to test http proxy hosts
#      - "127.0.0.1:8443:443"   # uncomment if you want to test https proxy hosts
    volumes:
      - "./data:/data"                 # persistent data (db, certs) on the host
      - "./backend:/app"               # live-edit backend source
      - "npmplus_node_modules:/app/node_modules"  # keep image's native modules
      - "npmplus_frontend:/app/frontend"          # keep image's prebuilt UI
    environment:
      - "TZ=Europe/Berlin"
      # Fixed secret so login tokens survive container restarts during dev:
      - "COOKIE_SECRET=dev-only-not-a-secret-change-me"
      # Auto-create an admin so you can log in immediately (dev only):
      - "INITIAL_ADMIN_EMAIL=admin@example.com"
      - "INITIAL_ADMIN_PASSWORD=changeme123"

volumes:
  npmplus_node_modules:
  npmplus_frontend:
